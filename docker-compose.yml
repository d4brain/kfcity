services:
  city:
    image: 'nginx:alpine'
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    expose:
      - '80'
    healthcheck:
      disable: true
    labels:
      - traefik.enable=true
      - traefik.docker.network=p2t6g68wq96tuiiau90v93w0
      - traefik.http.services.city-service.loadbalancer.server.port=80
      - traefik.http.services.city-service.loadbalancer.server.scheme=http

      - traefik.http.routers.city-http.rule=Host(`city.catchiai.com`)
      - traefik.http.routers.city-http.entrypoints=http
      - traefik.http.routers.city-http.priority=1000
      - traefik.http.routers.city-http.middlewares=city-https-redirect
      - traefik.http.routers.city-http.service=city-service
      - traefik.http.middlewares.city-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.city-https-redirect.redirectscheme.permanent=true

      - traefik.http.routers.city-https.rule=Host(`city.catchiai.com`)
      - traefik.http.routers.city-https.entrypoints=https
      - traefik.http.routers.city-https.priority=1000
      - traefik.http.routers.city-https.tls=true
      - traefik.http.routers.city-https.tls.certresolver=letsencrypt
      - traefik.http.routers.city-https.service=city-service
    command:
      - /bin/sh
      - '-c'
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 80;
          server_name _;

          client_max_body_size 55m;

          location / {
            proxy_pass http://host.docker.internal:31400;
            proxy_http_version 1.1;

            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
          }
        }
        EOF

        exec nginx -g 'daemon off;'

networks:
  default:
    external: true
    name: p2t6g68wq96tuiiau90v93w0
